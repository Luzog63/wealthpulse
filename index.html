<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>WealthPulse</title></head><body>
<p id="b">Chargement WealthPulse…</p>
<script>
(async()=>{
  try{
    const parts=[];
    for (const u of ["p0.b64","p1.b64","p2.b64","p3.b64","p4.b64","p5.b64"]) parts.push(await (await fetch(u)).text());
    const bin=Uint8Array.from(atob(parts.join("").trim()),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  }catch(e){ document.getElementById("b").textContent=String(e); }
})();
</script></body></html>
